# Use Tastiera instead of plasma-keyboard on the Plasma Login Manager greeter.
# Installed by the tastiera package; plasma-login-manager hard-codes
# "--inputmethod plasma-keyboard" in plasma-login-kwin_wayland.service.
# Keep the other arguments in sync with that unit if it changes.
[Service]
ExecStart=
ExecStart=/usr/bin/kwin_wayland --no-lockscreen --no-global-shortcuts --no-kactivities --inputmethod tastiera --locale1
